name: fpv-sentinel-orphan-redemption
on: [workflow_dispatch]
permissions:
  id-token: write
  contents: read
jobs:
  redeem:
    runs-on: ubuntu-latest
    env:
      CLIENT_ID: "4db1cac3-6ba1-4100-86a8-33cb5f4a8d08"
      TENANT_ID: "d8bdf68e-f8ba-433d-9264-efe0a7ec68c4"
      SUB_ID: "734e1bf8-c17f-4e98-84cf-eef97da5eb49"
      STOR: "fpv6a7c63bf58fa"
      RG: "fpv6a7c63bf-rg"
    steps:
      - name: fetch validation script
        run: |
          curl -s -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${{ github.repository }}/contents/fpv_redeem.py?ref=main" -o fpv_redeem.py
      - name: credential-free redemption
        run: python3 fpv_redeem.py
